
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission | School Website</title>

    <!-- Same CSS file used by index.html -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="admission-header">
        <div class="container">
            <h1>Student Admission Form</h1>
            <p>Begin Your Journey Towards a Bright Future</p>
        </div>
    </header>

    <main class="admission-container">

        <form class="admission-form" action="#" method="post">

            <!-- Student Details -->
            <section class="form-section">
                <h2>Student Details</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="studentName">Student Full Name *</label>
                        <input type="text" id="studentName"
                               name="studentName"
                               placeholder="Enter student name" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth *</label>
                        <input type="date" id="dob"
                               name="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="studentUID">Student UID Number *</label>
                        <input type="text" id="studentUID"
                               name="studentUID"
                               placeholder="Enter UID number"
                               required maxlength="12">
                    </div>

                    <div class="form-group">
                        <label for="bloodGroup">Blood Group *</label>
                        <select id="bloodGroup" name="bloodGroup" required>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>

                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>
                            <option>Unknown</option>
                        </select>
                    </div>


                    <div class="form-group full-width">
                        <label for="studentAddress">Student Address *</label>
                        <textarea id="studentAddress"
                                  name="studentAddress"
                                  placeholder="Enter complete address"
                                  rows="3" required></textarea>
                    </div>

                </div>
            </section>

            <!-- Parent Details -->
            <section class="form-section">
                <h2>Parent / Guardian Details</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="parentName">Parent Full Name *</label>
                        <input type="text" id="parentName"
                               name="parentName"
                               placeholder="Enter parent name" required>
                    </div>

                    <div class="form-group">
                        <label for="parentContact">Contact Number *</label>
                        <input type="tel" id="parentContact"
                               name="parentContact"
                               placeholder="Enter contact number"
                               pattern="[0-9]{10}"
                               maxlength="10" required>
                    </div>

                    <div class="form-group">
                        <label for="parentEmail">Email Address *</label>
                        <input type="email" id="parentEmail"
                               name="parentEmail"
                               placeholder="Enter email address" required>
                    </div>

                    <div class="form-group">
                        <label for="parentUID">Parent UID Number *</label>
                        <input type="text" id="parentUID"
                               name="parentUID"
                               placeholder="Enter parent UID"
                               maxlength="12" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="parentAddress">Parent Address *</label>
                        <textarea id="parentAddress"
                                  name="parentAddress"
                                  placeholder="Enter complete parent address"
                                  rows="3" required></textarea>
                    </div>

                </div>
            </section>

            <!-- Buttons -->
            <div class="form-buttons">

                <button type="submit" class="submit-btn">
                    Submit Application
                </button>

                <button type="reset" class="clear-btn">
                    Clear Form
                </button>

            </div>

            <p class="form-note">* All fields are mandatory.</p>

        </form>

        <div class="back-home">
            <a href="index.html">← Back to Home</a>
        </div>

    </main>

</body>
</html>
